appId: com.geoaino.desktop
productName: GeoAino
directories:
  output: desktop/dist-installer
files:
  - desktop/dist/**/*
  - package.json
  # electron-builder copie par defaut l'arbre production node_modules complet
  # dans app.asar, independamment de `files` ci-dessus (revue finale,
  # Finding 3) : une TROISIEME copie de node_modules, a cote de
  # `resources/app/node_modules` (trace Next standalone) et
  # `resources/node_modules` (CLI Prisma) — 555 Mo constates dans
  # app.asar.unpacked pour des paquets (@img, @napi-rs, @next, @prisma,
  # jszip, prisma) jamais lus par `desktop/src/main.ts`, dont la seule
  # dependance runtime reelle (hors Node/Electron natifs) est `bcryptjs`.
  # Le motif `!node_modules/**/*` retire la copie par defaut ; l'inclusion
  # explicite qui suit ne rajoute que ce qui est effectivement utilise.
  - "!node_modules/**/*"
  - node_modules/bcryptjs/**/*
extraResources:
  - from: desktop/vendor/pg-portable
    to: pg-portable
  - from: desktop/vendor/referentiels
    to: referentiels
  - from: .next/standalone
    to: app
  # electron-builder exclut inconditionnellement tout dossier nomme
  # "node_modules" a la RACINE d'un `from` copie (app-builder-lib/out/
  # util/filter.js : `if (relative === "node_modules") return false;` —
  # verification structurelle, non contournable par un `filter:`). Sans
  # cette entree separee, `.next/standalone/node_modules` (donc `next`,
  # `react`, etc.) disparaissait silencieusement de `resources/app`, d'ou
  # `Cannot find module 'next'` au demarrage du serveur standalone. En lui
  # donnant sa propre entree, "node_modules" n'est plus le premier segment
  # relatif de CE `from` (qui pointe directement dedans), donc l'exclusion
  # ne s'applique plus.
  - from: .next/standalone/node_modules
    to: app/node_modules
  - from: node_modules/prisma
    to: node_modules/prisma
  - from: node_modules/@prisma
    to: node_modules/@prisma
  - from: prisma
    to: prisma
  # tileserver-gl embarque : tuiles OSM raster + vecteur pour le mode offline.
  # Le vendor est buildé separement via scripts/setup-tileserver.mjs.
  - from: desktop/vendor/tileserver
    to: tileserver
win:
  target: nsis
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
